version: '3.8'
services:
    app:
        build:
            context: .
        container_name: ${CONTAINER_NAME}
        environment:
            NODE_ENV: "${NODE_ENV}"
        restart: unless-stopped
        tty: true
        ports:
            - '${PORT:-8081}:${PORT:-8081}'
        volumes:
            - ..:/app
        networks:
            - eiko-network

networks:
  eiko-network:
    external: true
